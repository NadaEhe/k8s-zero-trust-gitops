apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "taskapi.fullname" . }}
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
# The API never talks to the Kubernetes API: no token is mounted (see Deployment).
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskapi.fullname" . }}
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
    {{- include "taskapi.apiSelectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "taskapi.apiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
