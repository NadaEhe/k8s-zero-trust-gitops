{{- if .Values.autoscaling.enabled }}
# HorizontalPodAutoscaler: adds replicas when average CPU goes above the target.
# Needs metrics-server (installed by the platform layer).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "taskapi.fullname" . }}
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "taskapi.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
# PodDisruptionBudget: a node drain (upgrade, maintenance) may never evict
# so many API pods that fewer than minAvailable remain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "taskapi.fullname" . }}
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "taskapi.apiSelectorLabels" . | nindent 6 }}
{{- end }}
