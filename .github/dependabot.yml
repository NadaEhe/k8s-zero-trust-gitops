# Dependabot opens PRs when dependencies get updates (incl. security fixes).
# Each PR runs the full CI + E2E pipeline before it can be merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
