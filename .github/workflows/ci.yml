# CI: test -> validate manifests -> build + scan + push image -> GitOps commit.
#
# Security notes
# - Every third-party action is pinned to a full commit SHA (tags can be moved:
#   see the March 2026 trivy-action supply-chain attack, CVE-2026-33634).
# - The default token is read-only; each job asks only for what it needs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/nadaehe/k8s-zero-trust-gitops/taskapi

jobs:
  app:
    name: App · lint & tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7-trixie
        env:
          POSTGRES_DB: taskapi
          POSTGRES_USER: taskapi
          POSTGRES_PASSWORD: taskapi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskapi -d taskapi"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (pytest, real PostgreSQL)
        run: pytest

  manifests:
    name: Kubernetes · lint & validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load pinned versions
        run: grep -E '^[A-Z_]+=' scripts/versions.env >> "$GITHUB_ENV"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform (checksum verified)
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -sSfLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -sSfLO "${base}/CHECKSUMS"
          grep " kubeconform-linux-amd64.tar.gz$" CHECKSUMS | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Helm lint
        run: |
          helm lint --strict charts/taskapi -f environments/dev/values.yaml
          helm lint --strict charts/taskapi -f environments/prod/values.yaml
      - name: Render chart for both environments
        run: |
          mkdir -p rendered
          helm template taskapi charts/taskapi -n taskapi-dev  -f environments/dev/values.yaml  > rendered/dev.yaml
          helm template taskapi charts/taskapi -n taskapi-prod -f environments/prod/values.yaml > rendered/prod.yaml
      - name: Validate against Kubernetes + CRD schemas (kubeconform)
        run: |
          kubeconform -strict -summary -output pretty \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/ gitops/ bootstrap/namespaces.yaml bootstrap/argocd/argocd-cm.yaml bootstrap/argocd/argocd-cmd-params-cm.yaml
      - name: Check that pinned versions are consistent
        run: |
          grep -q "argo-cd/${ARGOCD_VERSION}/manifests" bootstrap/argocd/kustomization.yaml \
            || { echo "Argo CD version in kustomization.yaml != versions.env"; exit 1; }
      - name: ShellCheck scripts
        run: shellcheck -x scripts/*.sh

  image:
    name: Image · build, scan, push
    needs: [app]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write          # push to ghcr.io
      security-events: write   # upload the Trivy report to the Security tab
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute image tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy) - fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan image (Trivy) - SARIF report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          format: sarif
          output: trivy.sarif
          skip-setup-trivy: true
      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (same build, from cache) with SBOM + provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

  gitops:
    name: GitOps · deploy to dev
    # Runs only on main, after everything is green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image, manifests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # commit the new image tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did the application change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- app/; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the new image tag to environments/dev (this commit IS the deployment)
        if: steps.changed.outputs.app == 'true'
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"${TAG}\"/" environments/dev/values.yaml
          grep -q "tag: \"${TAG}\"" environments/dev/values.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/dev/values.yaml
          git commit -m "deploy(dev): taskapi ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "### Deployed \`${TAG}\` to **dev** via Git commit. Argo CD will sync it." >> "$GITHUB_STEP_SUMMARY"
