# One shared Gateway for the whole cluster, implemented by Cilium (Envoy).
# Teams attach HTTPRoutes to it from their own namespaces, but only namespaces
# labelled shared-gateway-access=true are accepted (see bootstrap/namespaces.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: gateway-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      hostname: "*.localtest.me"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              shared-gateway-access: "true"
