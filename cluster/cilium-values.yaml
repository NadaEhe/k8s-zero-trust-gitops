# Cilium Helm values (chart version pinned in scripts/versions.env).
# Docs: https://docs.cilium.io/en/stable/
#
# k8sServiceHost / k8sServicePort are passed by scripts/bootstrap.sh because,
# without kube-proxy, Cilium must be told directly where the API server is.

# --- Networking -------------------------------------------------------------
ipam:
  mode: kubernetes            # pod CIDRs come from the Kubernetes nodes (kind default)
kubeProxyReplacement: true    # eBPF replaces kube-proxy for Services
image:
  pullPolicy: IfNotPresent
operator:
  replicas: 1                 # a single operator is enough on a laptop
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

# --- Gateway API (replaces an ingress controller) ---------------------------
# Envoy listens directly on the nodes' network (no LoadBalancer needed on kind).
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true

# --- Observability ----------------------------------------------------------
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
envoy:
  prometheus:
    serviceMonitor:
      enabled: true
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enableOpenMetrics: true
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - "httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction"
      - "policy:sourceContext=app|workload-name|pod|reserved-identity;destinationContext=app|workload-name|pod|dns|reserved-identity;labelsContext=source_namespace,destination_namespace"
    serviceMonitor:
      enabled: true

# Ships Cilium + Hubble Grafana dashboards as ConfigMaps that Grafana auto-loads.
dashboards:
  enabled: true
  namespace: monitoring
