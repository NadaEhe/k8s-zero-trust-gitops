# Local Kubernetes cluster: 1 control-plane + 2 workers, running as Docker containers.
#
# - The default CNI (kindnet) and kube-proxy are disabled: Cilium replaces BOTH
#   (eBPF networking + eBPF service load-balancing).
# - Port 8080 of your machine is mapped to the control-plane node, where the
#   Cilium Gateway (Envoy, host-network mode) listens. So
#   http://<anything>.localtest.me:8080 reaches the Gateway
#   (*.localtest.me is a public DNS name that always resolves to 127.0.0.1).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: zt-gitops
networking:
  disableDefaultCNI: true
  kubeProxyMode: "none"
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      - containerPort: 8080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
