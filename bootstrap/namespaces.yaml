# Namespaces are created at bootstrap (before Argo CD) because the database
# Secrets must exist in them before the apps start.
#
# Labels:
#  - pod-security.kubernetes.io/enforce: restricted
#      The Kubernetes Pod Security Admission controller REJECTS any pod that
#      runs as root, keeps Linux capabilities, allows privilege escalation...
#  - shared-gateway-access: "true"
#      Only namespaces with this label may attach routes to the shared Gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: taskapi-dev
  labels:
    shared-gateway-access: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: taskapi-prod
  labels:
    shared-gateway-access: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    shared-gateway-access: "true"
    # node-exporter needs host access, so this namespace cannot be "restricted".
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    shared-gateway-access: "true"
