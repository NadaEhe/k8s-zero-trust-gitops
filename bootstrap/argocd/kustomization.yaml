# Argo CD installation = the official manifests + two small patches.
# Keep the version in sync with ARGOCD_VERSION in scripts/versions.env
# (CI checks that they match).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.2/manifests/install.yaml
patches:
  - path: argocd-cmd-params-cm.yaml
  - path: argocd-cm.yaml
