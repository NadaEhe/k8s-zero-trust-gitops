apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Check Git every 60s (default 120s). In a real setup, a GitHub webhook
  # triggers the sync instantly instead of polling.
  timeout.reconciliation: 60s

  # Cilium creates one CiliumIdentity object per set of pod labels. They are
  # runtime state, not something we manage in Git: tell Argo CD to ignore them.
  resource.exclusions: |
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      clusters:
      - "*"

  # Health check for Application objects, so that sync waves in the
  # "app of apps" really wait for a child app to be Healthy before the next wave.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
